<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clauxel GitHub Pages</title>
    <meta
      name="description"
      content="Clauxel public GitHub Pages index with practical technical guides."
    >
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://clauxel.github.io/">
    <style>
      :root {
        color-scheme: light;
        --ink: #14212a;
        --muted: #5b6872;
        --line: #d9e0e4;
        --paper: #fbfcfa;
        --band: #eef6f5;
        --teal: #007c79;
        --blue: #1d5fd1;
        --coral: #ce4b31;
        --lime: #9aaa21;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
      }

      section {
        width: min(760px, 100%);
      }

      .eyebrow {
        color: var(--teal);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 14px;
        font-size: clamp(2.4rem, 9vw, 5rem);
        letter-spacing: 0;
        line-height: 0.95;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        max-width: 58ch;
      }

      a {
        color: var(--blue);
        font-weight: 800;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <div class="eyebrow">Clauxel Guides</div>
        <h1 id="page-title">Practical technical notes</h1>
        <p>
          Start with the
          <a href="/markitdown/">MarkItDown guide for document-to-Markdown workflows</a>.
        </p>
      </section>
    </main>
  </body>
</html>
