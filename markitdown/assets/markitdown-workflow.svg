<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">MarkItDown conversion workflow</title>
  <desc id="desc">A workflow diagram showing files, MarkItDown conversion, Markdown review, and downstream use in LLMs, search, notes, and automation.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10303a" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#d7e4e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="820" rx="0" fill="#f6faf8"/>
  <rect x="0" y="0" width="1280" height="820" fill="url(#grid)" opacity="0.6"/>
  <g transform="translate(80 84)">
    <rect x="0" y="0" width="1120" height="652" rx="18" fill="#ffffff" stroke="#d9e0e4" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1120" height="72" rx="18" fill="#14212a"/>
    <circle cx="38" cy="36" r="9" fill="#ce4b31"/>
    <circle cx="68" cy="36" r="9" fill="#d6a321"/>
    <circle cx="98" cy="36" r="9" fill="#1f9a82"/>
    <text x="138" y="43" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef6f5">markitdown workflow</text>

    <g transform="translate(70 132)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#14212a">Sources</text>
      <g transform="translate(0 36)">
        <rect x="0" y="0" width="210" height="58" rx="8" fill="#eef6f5" stroke="#b8ceca"/>
        <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">PDF reports</text>
        <rect x="0" y="78" width="210" height="58" rx="8" fill="#fff4ef" stroke="#e6b19f"/>
        <text x="22" y="114" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Office files</text>
        <rect x="0" y="156" width="210" height="58" rx="8" fill="#f0f5ff" stroke="#adc5ef"/>
        <text x="22" y="192" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">HTML and data</text>
        <rect x="0" y="234" width="210" height="58" rx="8" fill="#f7f9e7" stroke="#cbd487"/>
        <text x="22" y="270" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Media metadata</text>
      </g>
    </g>

    <g transform="translate(420 178)">
      <rect x="0" y="0" width="284" height="228" rx="8" fill="#14212a"/>
      <text x="36" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">MarkItDown</text>
      <text x="36" y="94" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c7d4dc">CLI, Python, MCP, hosted API</text>
      <rect x="36" y="126" width="212" height="54" rx="8" fill="#007c79"/>
      <text x="62" y="160" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Convert to Markdown</text>
    </g>

    <path d="M306 300 H392" stroke="#007c79" stroke-width="8" stroke-linecap="round"/>
    <path d="M382 278 L414 300 L382 322 Z" fill="#007c79"/>
    <path d="M728 300 H814" stroke="#007c79" stroke-width="8" stroke-linecap="round"/>
    <path d="M804 278 L836 300 L804 322 Z" fill="#007c79"/>

    <g transform="translate(850 132)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#14212a">Outputs</text>
      <g transform="translate(0 36)">
        <rect x="0" y="0" width="210" height="58" rx="8" fill="#eef6f5" stroke="#b8ceca"/>
        <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Clean Markdown</text>
        <rect x="0" y="78" width="210" height="58" rx="8" fill="#f0f5ff" stroke="#adc5ef"/>
        <text x="22" y="114" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">LLM context</text>
        <rect x="0" y="156" width="210" height="58" rx="8" fill="#fff4ef" stroke="#e6b19f"/>
        <text x="22" y="192" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Search indexes</text>
        <rect x="0" y="234" width="210" height="58" rx="8" fill="#f7f9e7" stroke="#cbd487"/>
        <text x="22" y="270" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Agent workflows</text>
      </g>
    </g>

    <g transform="translate(70 520)">
      <rect x="0" y="0" width="980" height="74" rx="8" fill="#f6faf8" stroke="#d9e0e4"/>
      <text x="28" y="45" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14212a">Review headings, tables, citations, and sensitive files before publishing the converted Markdown.</text>
    </g>
  </g>
</svg>
